# servo_urdf_map.yaml — servo (firmware) <-> URDF joint (inmoov_i2.urdf) mapping.
#
# Used by urdf_bridge_node (inmoov_control) and by the Android app via rosbridge.
# points: [servo_deg, urdf_rad] — piecewise linear, >= 2 points, monotonic.
#   between points: linear; outside: end-segment slope, then clamped to
#   servo_range (firmware min/max) and urdf_limits (URDF <limit>).
#
# INITIAL GUESS, NOT CALIBRATED (verified: false everywhere):
#   * arm / neck / torso ("direct"): 1 servo degree = 1 joint degree,
#     URDF zero = firmware rest angle, direction +1 (except neck, rollneck,
#     midstom, rotate_R: -1);
#   * fingers / face / eyes (linkages): servo [min, rest, max] stretched over
#     URDF [lower, 0, upper].
# Directions of all joints checked on the robot 2026-09-29 (mirror mode of the
# Android app); the scale is still uncalibrated — the calibration tab of the Android app writes the corrected table to
# ~/.config/inmoov/servo_urdf_map.yaml (overrides this file joint by joint).
#
# Generated 2026-09-28 from arduino_{left,right}_node.py tables and
# inmoov_description/description/inmoov_i2.urdf.xacro limits.
# Author: Artur Fedjukevits. Assisted by: Claude (Anthropic). License: GPL-3.0-only
