telegram_bridge_node:
  ros__parameters:
    # REQUIRED: the Telegram chat_id allowed to send commands.
    # Find your chat_id: message @userinfobot or @RawDataBot.
    allowed_chat_id: 0

    # Timeout waiting for a reply from llm_node (sec).
    # Set it a bit higher than timeout_sec in llm_node (default 30).
    llm_timeout_sec: 35.0

    # Path to the SQLite DB for looking up telegram_id → person
    memory_db_path: "/home/artur/inmoov_memory.db"

    # Camera device for /photo (left eye)
    cam_device: "/dev/v4l/by-path/pci-0000:c6:00.3-usb-0:1.1:1.0-video-index0"
