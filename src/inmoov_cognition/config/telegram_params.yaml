telegram_bridge_node:
  ros__parameters:
    # ОБЯЗАТЕЛЬНО: Telegram chat_id которому разрешены команды.
    # Узнать свой chat_id: написать боту @userinfobot или @RawDataBot.
    allowed_chat_id: 0

    # Таймаут ожидания ответа от llm_node (сек).
    # Ставьте чуть больше чем timeout_sec в llm_node (по умолчанию 30).
    llm_timeout_sec: 35.0

    # Путь к SQLite БД для поиска telegram_id → person
    memory_db_path: "/home/artur/inmoov_memory.db"

    # Устройство камеры для /photo (левый глаз)
    cam_device: "/dev/v4l/by-path/pci-0000:c6:00.3-usb-0:1.1:1.0-video-index0"
