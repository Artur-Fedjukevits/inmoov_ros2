# lifecycle.yaml — tier and policy configuration for InmoovLifecycleManager
#
# critical: the node is mandatory, its failure blocks the tier and the whole system
# optional: retry → degraded (the robot keeps running without it)
#
# To add CAN-bus legs: list them in tier 1, critical: true — nothing else needs to change.
#
# Author: Artur Fedjukevits
# Assisted by: Claude Code (Anthropic)
# License: GNU General Public License v3.0 (see repository root LICENSE)

lifecycle_manager:
  ros__parameters:
    retry_count: 3
    retry_interval_sec: 10.0
    transition_timeout_sec: 30.0
    tier_advance_timeout_sec: 90.0
    watchdog_interval_sec: 5.0       # how often to poll get_state (sec)
    watchdog_startup_delay_sec: 15.0 # don't look at nodes while the system is still starting up
    max_respawn_count: 5             # after N watchdog-recovery attempts — give up

    tiers:
      # ── Tier 0: Foundation ───────────────────────────────────────────────
      - id: 0
        description: "Data layer — must be ready before everything else"
        nodes:
          - memory_node
        critical:
          - memory_node

      # ── Tier 1: Hardware Drivers ─────────────────────────────────────────
      - id: 1
        description: "Direct hardware access"
        nodes:
          - audio_source_node
          - arduino_left
          - arduino_right
          - face_capture_node
          - oak_node
          - sound_localization_node
        critical:
          - arduino_left        # no Arduino means no motion
          - arduino_right
        # face_capture_node, oak_node, sound_localization_node: retry → degraded

      # ── Tier 2: HW Consumers ────────────────────────────────────────────
      - id: 2
        description: "Nodes consuming tier-1 hardware"
        nodes:
          - wakeword_node
          - voice_detector_node
          - tts_node
          - joint_state_publisher
          - urdf_bridge          # servo <-> URDF for the Android app (rosbridge)
          - face_expressions   # launch name is 'face_expressions', not 'face_expressions_node'
          - face_detection_node_left
          - face_detection_node_right
        critical: []
        # all: retry → degraded (the robot can still work without them, just worse)

      # ── Tier 3: Processing ──────────────────────────────────────────────
      - id: 3
        description: "Signal processing"
        nodes:
          - face_tracker_node_left
          - face_tracker_node_right
          - voice_emotion_node
          - gigaam_stt_node     # STT: GigaAM-v3, Parakeet fallback for English
        critical: []
        # all: retry → degraded (the robot can still work without them, just worse)
      # ── Tier 4: Intelligence ────────────────────────────────────────────
      - id: 4
        description: "Recognition and intelligence"
        nodes:
          - face_recognition_node
          - face_gallery_node
          - emotion_recognition_node
          - vision_head_tracker_node
          - human_detection_node
          - scene_manager_node
          - llm_node
          - openhab_bridge_node
        critical:
          - llm_node             # no LLM means no responses (there's a fallback CPU model)
        # the rest: degraded

      # ── Tier 5: Context & Orchestration ─────────────────────────────────
      - id: 5
        description: "Context and behavior control"
        nodes:
          - identity_manager_node
          - behavior_manager_node
        critical:
          - identity_manager_node
          - behavior_manager_node

      # ── Tier 6: Optional External ───────────────────────────────────────
      - id: 6
        description: "Optional external interfaces"
        nodes:
          - telegram_bridge_node
        critical: []
        # Fully optional — degraded doesn't affect operation
